services:
  postgres:
    image: postgres:15-alpine
    container_name: nexlevr-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexlevr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexlevr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexlevr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexlevr} -d ${POSTGRES_DB:-nexlevr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexlevr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nexlevr-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexlevr}:${POSTGRES_PASSWORD:-nexlevr_dev_password}@postgres:5432/${POSTGRES_DB:-nexlevr}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexlevr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: nexlevr-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nexlevr-network

volumes:
  postgres_data:
    driver: local

networks:
  nexlevr-network:
    driver: bridge
